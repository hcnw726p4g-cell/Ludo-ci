<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ludo Afrique</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4ead8;color:#21180f;display:flex;justify-content:center;min-height:100vh}.app{width:min(100%,620px);padding:16px;text-align:center}.title{font-size:30px;font-weight:800;margin:4px 0}.sub{margin:0 0 12px;color:#6b5a45}#board{width:min(92vw,520px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background:#ead9bd;border:4px solid #21180f;border-radius:14px;overflow:hidden}.cell{border:1px solid #0001;display:flex;align-items:center;justify-content:center}.home.red{background:#d94b4b}.home.green{background:#4da96b}.track{background:#fffaf0}.safe{background:#f6d77b}.center{background:#21180f}.piece{width:72%;height:72%;border-radius:50%;border:2px solid #21180f;box-shadow:0 2px 3px #0004}.redP{background:#d52f2f}.greenP{background:#208a4e}.controls{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0}.dice{font-size:30px;font-weight:800;background:white;border:3px solid #21180f;border-radius:12px;width:68px;height:58px;display:flex;align-items:center;justify-content:center}button{border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:800;background:#21180f;color:#fff;box-shadow:0 4px 0 #0003}.info{background:#fffaf0;border-radius:12px;padding:10px;margin-top:8px;font-weight:700}.reset{background:#8b4d27;font-size:14px;padding:10px 14px;margin-top:10px}</style></head><body><main class="app"><div class="title">🌍 Ludo Afrique</div><p class="sub">Jeu Web — 2 joueurs</p><div id="board"></div><div class="controls"><div class="dice" id="dice">🎲</div><button id="roll">Lancer le dé</button></div><div class="info" id="info">Tour : 🔴 Rouge — lance le dé</div><button class="reset" id="reset">Nouvelle partie</button></main><script>
const board=document.querySelector('#board'),info=document.querySelector('#info'),dice=document.querySelector('#dice'),roll=document.querySelector('#roll'),reset=document.querySelector('#reset');
const path=[];for(let c=1;c<=13;c++)path.push([6,c]);for(let r=7;r<=13;r++)path.push([r,13]);for(let c=12;c>=1;c--)path.push([13,c]);for(let r=12;r>=7;r--)path.push([r,1]);for(let c=2;c<=6;c++)path.push([1,c]);for(let r=2;r<=6;r++)path.push([r,6]);
const state={turn:0,dice:0,red:[-1,-1,-1,-1],green:[-1,-1,-1,-1]};
function draw(){board.innerHTML='';for(let r=0;r<15;r++)for(let c=0;c<15;c++){let d=document.createElement('div');d.className='cell '+((r<6&&c<6)?'home red ':'')+((r>8&&c>8)?'home green ':'')+(path.some(p=>p[0]==r&&p[1]==c)?'track ':'')+(r==7&&c==7?'center ':'')+(path.findIndex(p=>p[0]==r&&p[1]==c)%5==0?'safe':'');board.appendChild(d)}state.red.forEach((p,i)=>place('red',p,i));state.green.forEach((p,i)=>place('green',p,i));addClicks()}
function place(color,pos,i){let d;if(pos<0){let b=color==='red'?[2,2]:[10,10],o=[[0,0],[0,3],[3,0],[3,3]][i];d=board.children[(b[0]+o[0])*15+b[1]+o[1]]}else{let idx=color==='red'?pos:(pos+13)%path.length,p=path[idx];d=board.children[p[0]*15+p[1]]}let q=document.createElement('div');q.className='piece '+(color==='red'?'redP':'greenP');d.appendChild(q)}
function msg(){info.textContent='Tour : '+(state.turn?'🟢 Vert':'🔴 Rouge')+(state.dice?' — dé : '+state.dice+' — choisis une pièce':' — lance le dé')}
function move(color,i){if(!state.dice||color!==['red','green'][state.turn])return;let a=state[color][i];if(a<0&&state.dice!==6){info.textContent='Il faut faire 6 pour sortir une pièce.';return}let n=a<0?0:a+state.dice;if(n>=path.length){info.textContent='Cette pièce ne peut pas avancer.';return}state[color][i]=n;state.dice=0;state.turn=1-state.turn;draw();msg()}
function addClicks(){document.querySelectorAll('.piece').forEach((el,k)=>{let color=k<4?'red':'green',i=k%4;el.onclick=()=>move(color,i)})}
roll.onclick=()=>{if(state.dice)return;state.dice=Math.floor(Math.random()*6)+1;dice.textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][state.dice];msg()};
reset.onclick=()=>{state.turn=0;state.dice=0;state.red=[-1,-1,-1,-1];state.green=[-1,-1,-1,-1];dice.textContent='🎲';draw();msg()};draw();
</script></body></html>
